# ===========================
# Production Environment Configuration (Example)
# ===========================
# Copy this file to application-prod.properties and fill in real values.
# NEVER commit application-prod.properties to version control.

# Database
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://your-db-host:3306/codoc_database?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=your_db_username
spring.datasource.password=your_db_password

# Redis
spring.data.redis.host=your-redis-host
spring.data.redis.port=6379
spring.data.redis.password=your_redis_password
spring.data.redis.database=0
